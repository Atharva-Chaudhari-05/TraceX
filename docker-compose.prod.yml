version: '3.8'

services:
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tracex:tracex_dev_password@db:5432/tracex
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=tracex_dev_password
    depends_on:
      - db
      - neo4j

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./Frontend/dist:/usr/share/nginx/html

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracex
      POSTGRES_PASSWORD: tracex_dev_password
      POSTGRES_DB: tracex
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/tracex_dev_password
    ports:
      - "7474:7474"
      - "7687:7687"
