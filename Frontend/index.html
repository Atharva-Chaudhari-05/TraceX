<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard against 'Cannot set property fetch of #<Window> which has only a getter'
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          if (_origFetch) {
            var _currentFetch = _origFetch;
            var descriptor = {
              get: function() { return _currentFetch; },
              set: function(val) { _currentFetch = val; },
              configurable: true,
              enumerable: true
            };
            try { Object.defineProperty(window, 'fetch', descriptor); } catch (e) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try { Object.defineProperty(Window.prototype, 'fetch', descriptor); } catch (e) {}
            }
          }
        } catch (err) {}
      })();

      // Immediate Theme Initializer: Default to light mode
      (function() {
        try {
          var saved = localStorage.getItem('tracex_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          if (theme === 'light') {
            document.documentElement.classList.add('light-theme');
            document.documentElement.classList.remove('dark-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
            document.documentElement.classList.add('dark-theme');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceX — AI-Powered Criminal Network Analysis & Intelligence Platform (SIH 2026)</title>
